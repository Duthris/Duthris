<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Anıl Yalımdemir — full-stack developer, open source at heart">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .flow { stroke-dasharray: 6 18; animation: flow 2.4s linear infinite; }
    .flow.slow { animation-duration: 3.6s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -96; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eeff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe4ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1f7a"/>
      <stop offset="0.55" stop-color="#6833e6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C81F9"/>
      <stop offset="0.5" stop-color="#6833E6"/>
      <stop offset="1" stop-color="#3A1F7A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a1d5c" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow1)"/>
    <rect width="1280" height="420" fill="url(#glow2)"/>

    <!-- Data flowing out to the right edge. -->
    <g fill="none" stroke-linecap="round" stroke-width="2.5">
      <path class="flow" d="M880 352 C 1000 352, 1080 312, 1290 312" stroke="#9c81f9" stroke-opacity="0.35"/>
      <path class="flow slow" d="M900 378 C 1030 378, 1110 360, 1290 360" stroke="#6b6cf0" stroke-opacity="0.35"/>
      <path class="flow" d="M1080 322 C 1140 322, 1180 270, 1290 270" stroke="#b9a6ff" stroke-opacity="0.35"/>
      <path class="flow slow" d="M960 70 C 1060 70, 1120 110, 1290 110" stroke="#6b6cf0" stroke-opacity="0.35"/>
    </g>
  </g>

  <g transform="translate(100 90)"><g transform="scale(1.0000)">
      <rect x="14" y="26" width="212" height="212" rx="56" fill="#7c4dff" opacity="0.55" filter="url(#soft)"/>
      <rect width="240" height="240" rx="60" fill="url(#icon)"/>
      <rect width="240" height="240" rx="60" fill="url(#shine)"/>
      <path d="M62 78 L112 120 L62 162" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="cursor" x="128" y="150" width="58" height="22" rx="11" fill="#fff"/>
    </g></g>

  <g font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="410" y="168" font-size="80" font-weight="800" letter-spacing="-2.5" fill="url(#title)">Anıl Yalımdemir</text>
    <text x="414" y="222" font-size="30" font-weight="500" fill="#2b2347">Full-stack developer. Open source at heart.</text>
    <text x="414" y="262" font-size="22" font-weight="400" fill="#6b6385" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SFMono-Regular', monospace">web · local-first apps · discord bots</text>
    <rect x="414" y="296" width="141" height="34" rx="17.0" fill="#7c4dff" fill-opacity="0.16" stroke="#9c81f9" stroke-opacity="0.5"/><text x="484" y="319" text-anchor="middle" font-size="17" font-weight="600" fill="#4b28b8">Antalya, TR</text>
    <rect x="567" y="296" width="112" height="34" rx="17.0" fill="#7c4dff" fill-opacity="0.16" stroke="#9c81f9" stroke-opacity="0.5"/><text x="623" y="319" text-anchor="middle" font-size="17" font-weight="600" fill="#4b28b8">DT Cloud</text>
    <rect x="691" y="296" width="141" height="34" rx="17.0" fill="#10b981" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.5"/><text x="761" y="319" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">Open source</text>
  </g>
</svg>
